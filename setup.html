<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Setup Awal - Kepolisian Nexotis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="siren-top" aria-hidden="true"><i></i><i></i></div>
      <div class="flag"><svg class="logo-svg" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8.2-7 10-4-1.8-7-5.5-7-10V6z"/><path d="M12 8.2l1.2 2.4 2.6.4-1.9 1.8.5 2.6-2.4-1.3-2.4 1.3.5-2.6-1.9-1.8 2.6-.4z" fill="currentColor" stroke="none"/></svg></div>
      <h1>SETUP AWAL</h1>
      <p>Halaman ini cuma bisa dipakai SEKALI, selama belum ada akun sama sekali di sistem. Dipakai untuk membuat akun High Command pertama.</p>

      <div class="form-group" style="text-align:left">
        <label for="secret">Setup Secret</label>
        <input type="password" id="secret" placeholder="isi SETUP_SECRET dari Environment Variables">
      </div>
      <div class="form-group" style="text-align:left">
        <label for="username">Username Admin</label>
        <input type="text" id="username" placeholder="mis. kapolda">
      </div>
      <div class="form-group" style="text-align:left">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="minimal 6 karakter">
      </div>
      <div class="form-group" style="text-align:left">
        <label for="pangkat">Pangkat</label>
        <input type="text" id="pangkat" placeholder="Kapolda" value="Kapolda">
      </div>
      <button class="btn btn-primary" style="width:100%" id="setup-btn">Buat Akun Admin</button>
      <div class="error-msg" id="msg"></div>
      <div class="foot">Setelah berhasil, halaman ini otomatis nggak akan bisa dipakai lagi.</div>
    </div>
  </div>

<script src="app.js"></script>
<script>
  document.getElementById("setup-btn").addEventListener("click", async () => {
    const msgEl = document.getElementById("msg");
    msgEl.style.color = "";
    msgEl.textContent = "";
    const secret = document.getElementById("secret").value;
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;
    const pangkat = document.getElementById("pangkat").value.trim();

    const btn = document.getElementById("setup-btn");
    btn.disabled = true; btn.textContent = "Membuat...";
    try {
      await api("/api/setup", { method: "POST", body: JSON.stringify({ secret, username, password, pangkat }) });
      msgEl.style.color = "#4ade80";
      msgEl.textContent = "Berhasil! Mengarahkan ke halaman login...";
      setTimeout(() => { window.location.href = "index.html"; }, 1500);
    } catch (e) {
      msgEl.textContent = e.message;
    } finally {
      btn.disabled = false; btn.textContent = "Buat Akun Admin";
    }
  });
</script>
</body>
</html>
